<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>XamePage Web Call</title>
<style>
*{box-sizing:border-box;margin:0}
body{
  min-height:100vh;background:#07101c;color:#edf3f8;
  font-family:Arial,sans-serif;display:flex;
  align-items:center;justify-content:center;padding:20px
}
.card{
  width:100%;max-width:430px;background:#0f1e2e;
  border-radius:24px;padding:28px;text-align:center
}
h1{font-size:25px;margin-bottom:8px}
#status{color:#8aafc8;margin:10px 0 20px}
video{
  width:100%;background:#000;border-radius:18px;
  display:none;max-height:55vh;object-fit:cover
}
#remoteVideo{display:none}
#localVideo{
  position:fixed;right:20px;bottom:90px;width:120px;
  border:2px solid #00b0a0;z-index:5;
  cursor:grab;touch-action:none;user-select:none
}
#localVideo.dragging{cursor:grabbing}
#localVideo.swapped{
  position:relative;right:auto;bottom:auto;width:100%;
  max-height:55vh;object-fit:cover;z-index:1
}
#remoteVideo.swapped{
  position:fixed;right:20px;bottom:90px;width:120px;
  border:2px solid #00b0a0;z-index:5;
  cursor:grab;touch-action:none;user-select:none
}
button{
  border:0;border-radius:12px;padding:14px 20px;
  margin:6px;font-weight:700;font-size:15px;cursor:pointer
}
.primary{background:#00b0a0;color:#001512}
.danger{background:#d9534f;color:#fff}
.secondary{background:#183047;color:#00b0a0}
input{
  width:100%;padding:13px;border-radius:10px;
  border:1px solid #294258;background:#07101c;
  color:#fff;font-size:15px;margin:7px 0
}
</style>
</head>
<body>
<div class="card">
  <h1 id="title">XamePage Web Call</h1>
  <div id="status">Connecting…</div>

  <input id="guestName" placeholder="Your name" maxlength="40">

  <video id="remoteVideo" autoplay playsinline></video>
  <video id="localVideo" autoplay muted playsinline></video>

  <div>
    <button id="startBtn" class="primary">Start Call</button>
    <button id="endBtn" class="danger" style="display:none">End Call</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const XAME_ID = location.pathname.split('/').filter(Boolean).pop();
const socket = io({
  query: {
    webCall: '1',
    targetUserId: XAME_ID
  }
});

let pc = null;
let localStream = null;
let callStarted = false;

const statusEl = document.getElementById('status');
const startBtn = document.getElementById('startBtn');
const endBtn = document.getElementById('endBtn');
const remoteVideo = document.getElementById('remoteVideo');
const localVideo = document.getElementById('localVideo');
const guestName = document.getElementById('guestName');
let videoSwapped = false;
let draggingVideo = null;
let dragOffsetX = 0;
let dragOffsetY = 0;
let pointerStartX = 0;
let pointerStartY = 0;
let pointerMoved = false;
let lastTapTime = 0;
let lastTapTarget = null;

function getThumbnail() {
  return videoSwapped ? remoteVideo : localVideo;
}

function resetVideoPosition(video) {
  video.style.left = '';
  video.style.top = '';
  video.style.right = '';
  video.style.bottom = '';
}

function swapVideos() {
  videoSwapped = !videoSwapped;

  const newThumbnail = getThumbnail();
  const newMain = videoSwapped ? localVideo : remoteVideo;

  // Completely reset both videos first.
  [localVideo, remoteVideo].forEach(video => {
    video.classList.remove('swapped', 'dragging');
    resetVideoPosition(video);

    video.style.position = '';
    video.style.width = '';
    video.style.maxHeight = '';
    video.style.zIndex = '';
    video.style.border = '';
  });

  // Exactly one main video.
  newMain.classList.add('swapped');
  newMain.style.display = 'block';
  newMain.style.position = 'relative';
  newMain.style.left = 'auto';
  newMain.style.top = 'auto';
  newMain.style.right = 'auto';
  newMain.style.bottom = 'auto';
  newMain.style.width = '100%';
  newMain.style.maxHeight = '55vh';
  newMain.style.objectFit = 'cover';
  newMain.style.zIndex = '1';
  newMain.style.border = '0';

  // Exactly one draggable thumbnail.
  newThumbnail.style.display = 'block';
  newThumbnail.style.position = 'fixed';
  newThumbnail.style.left = '';
  newThumbnail.style.top = '';
  newThumbnail.style.right = '20px';
  newThumbnail.style.bottom = '90px';
  newThumbnail.style.width = '120px';
  newThumbnail.style.maxHeight = '55vh';
  newThumbnail.style.objectFit = 'cover';
  newThumbnail.style.zIndex = '5';
  newThumbnail.style.border = '2px solid #00b0a0';

  // The thumbnail must never inherit the main-video state.
  newThumbnail.classList.remove('swapped');
}


function beginVideoPointer(e) {
  const thumb = getThumbnail();

  // Only the current thumbnail can be dragged.
  if (e.currentTarget !== thumb) return;

  const rect = thumb.getBoundingClientRect();

  draggingVideo = thumb;
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;
  pointerStartX = e.clientX;
  pointerStartY = e.clientY;
  pointerMoved = false;

  thumb.setPointerCapture?.(e.pointerId);
  e.preventDefault();
}

function moveVideoPointer(e) {
  if (!draggingVideo) return;

  const dx = Math.abs(e.clientX - pointerStartX);
  const dy = Math.abs(e.clientY - pointerStartY);

  if (dx > 6 || dy > 6) pointerMoved = true;

  if (!pointerMoved) return;

  const maxX = window.innerWidth - draggingVideo.offsetWidth;
  const maxY = window.innerHeight - draggingVideo.offsetHeight;

  draggingVideo.style.left =
    Math.max(0, Math.min(maxX, e.clientX - dragOffsetX)) + 'px';
  draggingVideo.style.top =
    Math.max(0, Math.min(maxY, e.clientY - dragOffsetY)) + 'px';
  draggingVideo.style.right = 'auto';
  draggingVideo.style.bottom = 'auto';

  draggingVideo.classList.add('dragging');
  e.preventDefault();
}

function endVideoPointer(e) {
  if (!draggingVideo) return;

  const thumb = draggingVideo;

  try {
    thumb.releasePointerCapture?.(e.pointerId);
  } catch (_) {}

  draggingVideo = null;
  thumb.classList.remove('dragging');

  // A tap (not a drag) is eligible for double-tap swapping.
  if (!pointerMoved) {
    const now = Date.now();

    if (lastTapTarget === thumb && now - lastTapTime < 350) {
      lastTapTime = 0;
      lastTapTarget = null;
      swapVideos();
      return;
    }

    lastTapTime = now;
    lastTapTarget = thumb;
  }
}

localVideo.addEventListener('pointerdown', beginVideoPointer);
remoteVideo.addEventListener('pointerdown', beginVideoPointer);

localVideo.addEventListener('pointermove', moveVideoPointer);
remoteVideo.addEventListener('pointermove', moveVideoPointer);

localVideo.addEventListener('pointerup', endVideoPointer);
remoteVideo.addEventListener('pointerup', endVideoPointer);

localVideo.addEventListener('pointercancel', endVideoPointer);
remoteVideo.addEventListener('pointercancel', endVideoPointer);


function status(text) {
  statusEl.textContent = text;
}

function makePeer() {
  pc = new RTCPeerConnection({
    iceServers: [
      { urls: 'stun:stun.l.google.com:19302' },
      { urls: 'stun:stun1.l.google.com:19302' }
    ]
  });

  pc.onicecandidate = e => {
    if (e.candidate) {
      socket.emit('web-call:ice', {
        targetUserId: XAME_ID,
        candidate: e.candidate
      });
    }
  };

  pc.ontrack = e => {
    if (e.streams && e.streams[0]) {
      remoteVideo.srcObject = e.streams[0];
      remoteVideo.style.display = 'block';
    }
  };

  pc.onconnectionstatechange = () => {
    if (!pc) return;
    if (pc.connectionState === 'connected') status('Call connected');
    if (['failed','disconnected','closed'].includes(pc.connectionState)) {
      status('Call ended');
    }
  };
}

async function startCall() {
  if (callStarted) return;

  const name = guestName.value.trim();
  if (!name) {
    alert('Please enter your name');
    return;
  }

  startBtn.disabled = true;
  status('Requesting camera and microphone…');

  try {
    localStream = await navigator.mediaDevices.getUserMedia({
      audio: true,
      video: true
    });

    localVideo.srcObject = localStream;
    localVideo.style.display = 'block';

    makePeer();

    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

    status('Calling…');

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);

    socket.emit('web-call:offer', {
      targetUserId: XAME_ID,
      offer: {
        type: offer.type,
        sdp: offer.sdp
      },
      fromName: name,
      callType: 'video'
    });

    callStarted = true;
    endBtn.style.display = 'inline-block';
  } catch (e) {
    console.error(e);
    status('Camera/microphone access failed');
    startBtn.disabled = false;
  }
}

async function endCall() {
  socket.emit('web-call:end', { targetUserId: XAME_ID });

  if (pc) {
    pc.close();
    pc = null;
  }

  if (localStream) {
    localStream.getTracks().forEach(t => t.stop());
    localStream = null;
  }

  localVideo.style.display = 'none';
  remoteVideo.style.display = 'none';

  callStarted = false;
  startBtn.disabled = false;
  endBtn.style.display = 'none';
  status('Call ended');
}

socket.on('web-call:answer', async data => {
  if (!pc) return;

  try {
    await pc.setRemoteDescription(
      new RTCSessionDescription(data.answer)
    );
    status('Connecting…');
  } catch (e) {
    console.error('Answer error:', e);
    status('Failed to establish call');
  }
});

socket.on('web-call:ice', async data => {
  if (!pc || !data.candidate) return;

  try {
    await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
  } catch (e) {
    console.warn('ICE error:', e);
  }
});

socket.on('web-call:accepted', () => {
  status('XamePage user accepted the call');
});

socket.on('web-call:rejected', data => {
  status(data?.reason === 'busy'
    ? 'User is currently busy'
    : 'Call declined');
});

socket.on('web-call:unavailable', () => {
  status('User is offline');
});

socket.on('web-call:ended', () => {
  status('Call ended by the other person');
  endCall();
});

socket.on('web-call:error', data => {
  status(data?.message || 'Call error');
  startBtn.disabled = false;
});

socket.on('connect', () => {
  status('Ready to call');
});

socket.on('disconnect', () => {
  status('Connection lost');
});

startBtn.onclick = startCall;
endBtn.onclick = endCall;
</script>
</body>
</html>
