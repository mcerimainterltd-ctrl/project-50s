name: Build XamePage APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Force Rebuild Project Chassis
        run: |
          cd flutter_version
          rm -rf android .metadata .packages
          # Force create with a specific organization name
          flutter create --platforms android --org com.xamepage .
          flutter pub get

      - name: Build APK
        run: |
          cd flutter_version
          # Using --debug first can sometimes bypass release-only signing errors 
          # but we will try release with a fix for the icon shaking
          flutter build apk --release --no-tree-shake-icons
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: flutter_version/build/app/outputs/flutter-apk/app-release.apk
