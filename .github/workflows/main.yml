name: Build XamePage APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Project
        run: |
          cd flutter_version
          rm -rf android
          flutter create --platforms android .
          flutter pub get

      - name: Build APK
        run: |
          cd flutter_version
          flutter build apk --release --verbose --no-tree-shake-icons
        
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: flutter_version/build/app/outputs/flutter-apk/app-release.apk
