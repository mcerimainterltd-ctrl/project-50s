name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install && npm install @capacitor/android @capacitor/core @capacitor/cli


      - name: Patch Capacitor WebChromeClient
        run: |
          FILE=node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/BridgeWebChromeClient.java
          if [ -f "$FILE" ]; then
            sed -i 's/public void onPermissionRequest(PermissionRequest permissionRequest) {/public void onPermissionRequest(PermissionRequest permissionRequest) { permissionRequest.grant(permissionRequest.getResources()); if (true) return;/' "$FILE"
            echo "Patched BridgeWebChromeClient"
          fi
      - name: Sync Capacitor
        run: npx @capacitor/cli sync android

      - name: Fix Capacitor Config
        run: cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XamePage-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
