name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install && npm install @capacitor/android @capacitor/core @capacitor/cli

      - name: Sync Capacitor
        run: npx @capacitor/cli sync android

      - name: Restore XamePage Icons
        run: |
          find android/app/src/main/res -name 'ic_launcher.png' -o -name 'ic_launcher_round.png' -o -name 'ic_launcher_foreground.png' | while read f; do cp www/media/icons/icon-512.png "$f"; done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          find android/app/src/main/res -name "splash.png" | while read f; do cp www/media/splash/xamepage_splash.png "$f"; done

      - name: Patch Capacitor WebChromeClient
        run: cp BridgeWebChromeClient.java.patch node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/BridgeWebChromeClient.java

      - name: Fix Capacitor Config
        run: cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XamePage-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
