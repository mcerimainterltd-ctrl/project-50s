name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install && npm install @capacitor/android @capacitor/core @capacitor/cli @capacitor/splash-screen @capacitor-firebase/messaging

      - name: Sync Capacitor
        run: npx @capacitor/cli sync android

      - name: Configure Firebase Messaging
        run: |
          echo "include ':capacitor-firebase-messaging'" >> android/settings.gradle
          echo "project(':capacitor-firebase-messaging').projectDir = new File('../node_modules/@capacitor-firebase/messaging/android')" >> android/settings.gradle
          sed -i "s|implementation project(':capacitor-cordova-android-plugins')|implementation project(':capacitor-cordova-android-plugins')\n    implementation project(':capacitor-firebase-messaging')|" android/app/build.gradle
          sed -i "s|import com.getcapacitor.BridgeActivity;|import com.getcapacitor.BridgeActivity;\nimport io.capawesome.capacitorjs.plugins.firebase.messaging.FirebaseMessagingPlugin;|" android/app/src/main/java/com/xamepage/app/MainActivity.java
          sed -i "s|registerPlugin(CameraPlugin.class);|registerPlugin(CameraPlugin.class);\n        registerPlugin(FirebaseMessagingPlugin.class);|" android/app/src/main/java/com/xamepage/app/MainActivity.java

      - name: Patch Capacitor WebChromeClient
        run: cp BridgeWebChromeClient.java.patch node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/BridgeWebChromeClient.java

      - name: Fix Capacitor Config
        run: cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Restore XamePage Icons
        run: |
          find android/app/src/main/res -name 'ic_launcher.png' -o -name 'ic_launcher_round.png' -o -name 'ic_launcher_foreground.png' | while read f; do cp www/media/icons/icon-512.png "$f"; done
          find android/app/src/main/res -name 'splash.png' | while read f; do cp www/media/splash/xamepage_splash.png "$f"; echo "Copied splash to $f"; done
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          rm -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      - name: Final Icon and Splash Restore
        run: |
          find android/app/src/main/res -name 'splash.png' | while read f; do cp www/media/splash/xamepage_splash.png "$f"; done
          find android/app/src/main/res -name 'ic_launcher.png' -o -name 'ic_launcher_round.png' -o -name 'ic_launcher_foreground.png' | while read f; do cp www/media/icons/icon-512.png "$f"; done

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XamePage-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
