name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install && npm install @capacitor/android @capacitor/core @capacitor/cli

      - name: Sync Capacitor
        run: npx @capacitor/cli sync android

      - name: Patch Capacitor WebChromeClient
        run: |
          FILE=$(find . -path '*/getcapacitor/BridgeWebChromeClient.java' 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            node -e "
              const fs = require('fs');
              let code = fs.readFileSync('$FILE', 'utf8');
              code = code.replace(/public void onPermissionRequest\(final PermissionRequest request\) \{[\s\S]*?\}(?=\s*/\*)/, 'public void onPermissionRequest(final PermissionRequest request) {\n        request.grant(request.getResources());\n    }');
              fs.writeFileSync('$FILE', code);
              console.log('Patched successfully');
            "
          else
            echo "BridgeWebChromeClient.java not found"
          fi

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XamePage-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
