name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: "21"
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install && npm install @capacitor/android @capacitor/core @capacitor/cli

      - name: Sync Capacitor
        run: npx @capacitor/cli sync android

      - name: Restore XamePage Icons
        run: |
          cp www/media/icons/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          cp www/media/icons/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png
          cp www/media/icons/icon-192.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
          cp www/media/icons/icon-144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          cp www/media/icons/icon-144.png android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          cp www/media/icons/icon-96.png android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          cp www/media/icons/icon-96.png android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          cp www/media/icons/icon-72.png android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          cp www/media/icons/icon-72.png android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          cp www/media/icons/icon-48.png android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          cp www/media/icons/icon-48.png android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png

      - name: Patch Capacitor WebChromeClient
        run: cp BridgeWebChromeClient.java.patch node_modules/@capacitor/android/capacitor/src/main/java/com/getcapacitor/BridgeWebChromeClient.java

      - name: Fix Capacitor Config
        run: cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XamePage-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
